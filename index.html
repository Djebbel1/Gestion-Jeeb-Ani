<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b6d"><title>Gestion Jeeb-Ani</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033}.app{display:flex;min-height:100vh}.side{width:230px;background:#173b6d;color:#fff;padding:18px;position:fixed;inset:0 auto 0 0}.brand{font-size:22px;font-weight:800;margin:8px 4px 25px}.nav button{display:block;width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:12px;border-radius:9px;margin:4px 0;font-size:15px}.nav button.active,.nav button:hover{background:#245a9a}.main{margin-left:230px;padding:22px;width:calc(100% - 230px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{margin:0;font-size:26px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border:1px solid #e1e7ef;border-radius:14px;padding:16px;box-shadow:0 2px 8px #18365d0d}.label{color:#68778a;font-size:12px}.value{font-size:25px;font-weight:800;margin-top:7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:8px;background:#245a9a;color:#fff;padding:10px 14px}.btn.yellow{background:#e8b923;color:#222}.section{margin-top:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #e8edf3;text-align:left}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:12px;color:#68778a;margin-bottom:4px}.field input,.field select{width:100%;padding:10px;border:1px solid #ccd6e2;border-radius:8px}.full{grid-column:1/-1}.notice{padding:12px;border-radius:10px;background:#eef3f9;margin-bottom:14px}.error{background:#fff0f0;color:#a11;border:1px solid #f2b8b8;padding:14px;border-radius:10px}@media(max-width:800px){.side{width:72px;padding:10px}.brand{font-size:0}.brand:after{content:'JA';font-size:20px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:24px}.main{margin-left:72px;width:calc(100% - 72px);padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.top{display:block}}
</style></head><body><div id="app"></div><script>
(function(){
'use strict';
var KEY='jeebAni_v2';
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{articles:[],sales:[],purchases:[],expenses:[],clients:[],accounts:[{id:id(),name:'Caisse',balance:0}],payments:[]}}catch(e){return {articles:[],sales:[],purchases:[],expenses:[],clients:[],accounts:[{id:id(),name:'Caisse',balance:0}],payments:[]}}}
var db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function money(n){return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(db.currency||'USD')}
function sum(a,k){return a.reduce(function(s,x){return s+Number(x[k]||0)},0)}
function go(page){location.hash=page;render()}
function nav(active){var items=[['dashboard','Tableau de bord'],['sales','Ventes'],['purchases','Achats'],['stock','Articles & stock'],['finance','Finances'],['clients','Clients'],['reports','Rapports'],['settings','Paramètres']];return '<nav class="nav">'+items.map(function(x){return '<button class="'+(active===x[0]?'active':'')+'" onclick="window.JA.go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</nav>'}
function shell(active,title,content){document.getElementById('app').innerHTML='<div class="app"><aside class="side"><div class="brand">Gestion Jeeb-Ani</div>'+nav(active)+'</aside><main class="main"><header><h1>'+title+'</h1><div class="notice">Hors ligne • Données locales</div></header>'+content+'</main></div>'}
function dashboard(){var ca=sum(db.sales,'total'),pa=sum(db.purchases,'total'),ex=sum(db.expenses,'amount');shell('dashboard','Tableau de bord','<div class="grid"><div class="card"><div class="label">Chiffre d’affaires</div><div class="value">'+money(ca)+'</div></div><div class="card"><div class="label">Achats</div><div class="value">'+money(pa)+'</div></div><div class="card"><div class="label">Dépenses</div><div class="value">'+money(ex)+'</div></div><div class="card"><div class="label">Articles</div><div class="value">'+db.articles.length+'</div></div></div><div class="section card"><h2>Gestion rapide</h2><div class="actions"><button class="btn" onclick="JA.go(\'sales\')">Nouvelle vente</button><button class="btn" onclick="JA.go(\'purchases\')">Nouvel achat</button><button class="btn yellow" onclick="JA.go(\'stock\')">Gérer le stock</button></div></div><div class="section card"><h2>Résultat estimatif</h2><div class="value">'+money(ca-pa-ex)+'</div></div>')}
function listPage(type,title,fields){var arr=db[type];var rows=arr.map(function(x){return '<tr>'+fields.map(function(f){return '<td>'+String(x[f]??'')+'</td>'}).join('')+'</tr>'}).join('');shell(type,title,'<div class="card"><div class="actions"><button class="btn" onclick="JA.add(\''+type+'\')">Ajouter</button></div><div class="section" style="overflow:auto"><table class="table"><thead><tr>'+fields.map(function(f){return '<th>'+f+'</th>'}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>')}
function formPage(type,title,labels){shell(type,title,'<div class="card"><div class="form">'+labels.map(function(x){return '<div class="field"><label>'+x[1]+'</label><input id="f_'+x[0]+'" type="'+(x[2]||'text')+'"></div>'}).join('')+'</div><div class="actions section"><button class="btn" onclick="JA.saveForm(\''+type+'\')">Enregistrer</button><button class="btn yellow" onclick="JA.go(\'dashboard\')">Annuler</button></div></div>')}
function add(t){if(t==='sales')return formPage('sales','Nouvelle vente',[['date','Date','date'],['customer','Client'],['total','Montant','number']]);if(t==='purchases')return formPage('purchases','Nouvel achat',[['date','Date','date'],['supplier','Fournisseur'],['total','Montant','number']]);if(t==='expenses')return formPage('expenses','Nouvelle dépense',[['date','Date','date'],['label','Libellé'],['amount','Montant','number']]);if(t==='articles')return formPage('articles','Nouvel article',[['code','Code'],['name','Désignation'],['qty','Stock initial','number'],['price','Prix de vente','number']])}
function saveForm(t){var o={id:id()};document.querySelectorAll('[id^="f_"]').forEach(function(el){o[el.id.slice(2)]=el.value});if(t==='sales'){o.total=Number(o.total||0);db.sales.push(o)}else if(t==='purchases'){o.total=Number(o.total||0);db.purchases.push(o)}else if(t==='expenses'){o.amount=Number(o.amount||0);db.expenses.push(o)}else if(t==='articles'){o.qty=Number(o.qty||0);o.price=Number(o.price||0);db.articles.push(o)}save();go(t==='articles'?'stock':t==='expenses'?'finance':t)}
function render(){try{var p=location.hash.slice(1)||'dashboard';if(p==='dashboard')dashboard();else if(p==='sales')listPage('sales','Ventes',['date','customer','total']);else if(p==='purchases')listPage('purchases','Achats',['date','supplier','total']);else if(p==='stock')listPage('articles','Articles & stock',['code','name','qty','price']);else if(p==='finance')listPage('expenses','Finances / Dépenses',['date','label','amount']);else if(p==='clients')listPage('clients','Clients',['name','phone']);else if(p==='reports')shell('reports','Rapports','<div class="grid"><div class="card"><div class="label">Ventes</div><div class="value">'+money(sum(db.sales,'total'))+'</div></div><div class="card"><div class="label">Achats</div><div class="value">'+money(sum(db.purchases,'total'))+'</div></div><div class="card"><div class="label">Dépenses</div><div class="value">'+money(sum(db.expenses,'amount'))+'</div></div></div>');else if(p==='settings')shell('settings','Paramètres','<div class="card"><h2>Gestion Jeeb-Ani</h2><p>Données enregistrées uniquement sur cet appareil.</p><div class="actions"><button class="btn" onclick="JA.exportData()">Exporter les données</button><button class="btn yellow" onclick="JA.reset()">Réinitialiser</button></div></div>');else dashboard()}catch(e){document.getElementById('app').innerHTML='<div style="padding:24px"><div class="error"><b>Gestion Jeeb-Ani n’a pas pu démarrer.</b><br>'+String(e.message||e)+'</div></div>'}}
window.JA={go:go,add:add,saveForm:saveForm,exportData:function(){var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(db,null,2));a.download='gestion-jeeb-ani.json';a.click()},reset:function(){if(confirm('Réinitialiser les données locales ?')){localStorage.removeItem(KEY);location.reload()}}};
window.addEventListener('hashchange',render);render();
})();
</script></body></html>
