<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b70"><title>Gestion Jeeb-Ani</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f4f6f9;color:#202938}.app{display:flex;min-height:100vh}.side{width:235px;background:#123b70;color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-size:21px;font-weight:800;padding:10px 8px 20px;border-bottom:1px solid #ffffff33}.brand small{display:block;font-size:11px;font-weight:400;opacity:.8;margin-top:5px}.nav button{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:12px;border-radius:8px;margin:4px 0}.nav button.active,.nav button:hover{background:#0b5ed7}.main{margin-left:235px;width:calc(100% - 235px)}header{background:#fff;border-bottom:1px solid #ddd;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0}.status{font-size:12px;color:#18723b}.content{padding:20px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border-radius:12px;padding:17px;box-shadow:0 2px 8px #0000000d;margin-bottom:16px}.label{font-size:12px;color:#667}.value{font-size:23px;font-weight:800;margin-top:7px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cdd4dc;border-radius:7px;background:#fff}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:7px;padding:10px 14px;background:#0b5ed7;color:#fff}.btn.ok{background:#198754}.btn.warn{background:#e5ad00;color:#222}.btn.danger{background:#c83e4d}.btn.light{background:#e9ecef;color:#222}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{font-size:12px;text-align:left;padding:9px 7px;border-bottom:1px solid #e6e9ed}th{background:#f4f6f8}.muted{color:#667;font-size:12px}.badge{padding:3px 7px;border-radius:12px;font-size:11px;background:#e8eef7}.bad{background:#f8d7da}.low{background:#fff3cd}.good{background:#d1e7dd}.linebox{border:1px solid #dce2e8;border-radius:9px;padding:12px;margin-top:12px}.summary{background:#eef4fb;padding:12px;border-radius:8px;margin-top:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid #ccd5df;background:#fff;padding:8px 11px;border-radius:7px}.tabs button.active{background:#123b70;color:#fff}.hidden{display:none!important}.notice{padding:10px 12px;border-radius:8px;background:#eef4fb;margin:10px 0}.warning{background:#fff3cd}.error{background:#f8d7da}.footer{text-align:center;color:#778;font-size:11px;padding:18px}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{display:block}.side{position:relative;width:100%}.main{margin:0;width:100%}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.grid,.form{grid-template-columns:1fr}.content{padding:12px}.full{grid-column:auto}header{padding:13px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Gestion Jeeb-Ani<small>Gestion commerciale et financière</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><header><h1 id="title">Tableau de bord</h1><div class="status">Données locales • v4</div></header><div class="content" id="content"></div><div class="footer">Gestion Jeeb-Ani — données conservées sur cet appareil</div></main></div><script>
(()=>{'use strict';const KEY='jeebAni_v4',LEGACY=['jeebAni_v3','jeebAni_v2'];let saleDraft=[],purchaseDraft=[];const uid=p=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7),num=v=>Number(v||0),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function blank(){return{version:4,articles:[],achats:[],lignesAchat:[],ventes:[],lignesVente:[],depenses:[],clients:[],paiements:[],comptes:[],transferts:[],mouvementsStock:[],inventaires:[],categories:['Alimentation','Boissons','Hygiène','Habillement','Électronique','Fournitures','Autres'],unites:['Pièce','Carton','Sac','Kg','Gramme','Litre','Bouteille','Paquet','Boîte','Mètre','Douzaine'],fournisseurs:[],modesPaiement:['Espèces','Mobile Money','Banque','Crédit'],journal:[],appareils:[],settings:{businessName:'Gestion Jeeb-Ani',currency:'CDF',defaultMargin:20},sequences:{ACH:0,VTE:0,DEP:0,PAY:0,TRF:0}}}
function mergeUnique(a,b){let m=new Map();[...(a||[]),...(b||[])].forEach(x=>{if(x){let k=x.id||JSON.stringify(x);if(!m.has(k))m.set(k,x)}});return[...m.values()]}
function migrateLegacy(){let d=blank(),found=false;for(const k of LEGACY){try{let x=JSON.parse(localStorage.getItem(k)||'null');if(!x)continue;found=true;d.articles=mergeUnique(d.articles,(x.articles||[]).map(a=>({...a,id:a.id||uid('ART'),code:a.code||a.code_article||'',name:a.name||a.designation||'',initialStock:num(a.initialStock??a.stock_initial??a.qty),alertThreshold:num(a.alertThreshold??a.seuil_alerte??5),cost:num(a.cost??a.cout_unitaire??0),sellingPrice:num(a.sellingPrice??a.prix_vente_actuel??a.price),margin:num(a.margin??a.marge_defaut??20)})));d.clients=mergeUnique(d.clients,x.clients||[]);d.comptes=mergeUnique(d.comptes,x.accounts||x.comptes||[]);(x.purchases||[]).forEach(p=>{let aid=p.achatId||p.id||uid('ACH');if(!d.achats.some(z=>z.id===aid))d.achats.push({id:aid,numero:p.reference||p.numero||aid,date:p.date||p.date_achat||today(),fournisseur:p.supplier||p.fournisseur||'',totalMarchandises:num(p.quantity)*num(p.purchasePrice||p.price||p.prix_achat_unitaire),transport:num(p.transport),taxes:num(p.taxes),manutention:0,autresFrais:num(p.other||p.autres_frais),coutTotal:num(p.total||0)});if(p.articleId)d.lignesAchat.push({id:uid('LA'),achatId:aid,articleId:p.articleId,quantite:num(p.quantity),prixAchatUnitaire:num(p.purchasePrice||p.price),fraisAffectes:num(p.transport)+num(p.taxes)+num(p.other),coutUnitaireReel:num(p.realUnitCost||p.cout_unitaire_reel||p.purchasePrice||p.price),prixVenteFinal:num(p.sellingPrice||0)})});(x.sales||[]).forEach(s=>{let vid=s.venteId||s.id||uid('VTE');if(!d.ventes.some(z=>z.id===vid))d.ventes.push({id:vid,numero:s.reference||s.numero||vid,date:s.date||today(),clientId:s.clientId||'',modePaiement:s.paymentMethod||s.mode_paiement||'Espèces',totalNet:num(s.total),montantPaye:num(s.paid??s.total),montantRestant:num(s.remaining||0)});if(s.articleId)d.lignesVente.push({id:uid('LV'),venteId:vid,articleId:s.articleId,quantite:num(s.quantity),prixUnitaire:num(s.price||s.prix_unitaire),totalLigne:num(s.total),coutUnitaire:num(s.cost||0),margeLigne:num(s.margin||0)})});d.depenses=mergeUnique(d.depenses,(x.expenses||x.depenses||[]).map(e=>({...e,id:e.id||uid('DEP'),date:e.date||today(),libelle:e.label||e.libelle||'',montant:num(e.amount??e.montant),categorie:e.category||e.categorie||'Autres'})));d.paiements=mergeUnique(d.paiements,x.payments||x.paiements||[]);d.settings={...d.settings,...(x.settings||{}),currency:(x.settings&&x.settings.currency)||x.currency||d.settings.currency}}catch(e){console.warn(k,e)}}if(!d.comptes.length)d.comptes=[{id:uid('CPT'),nom:'Caisse',type:'Espèces',soldeInitial:0},{id:uid('CPT'),nom:'Mobile Money',type:'Mobile Money',soldeInitial:0}];return{d,found}}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'null');if(v){let b=blank(),d={...b,...v,settings:{...b.settings,...(v.settings||{})},sequences:{...b.sequences,...(v.sequences||{})}};for(let k of ['articles','achats','lignesAchat','ventes','lignesVente','depenses','clients','paiements','comptes','transferts','mouvementsStock','inventaires','categories','unites','fournisseurs','modesPaiement','journal','appareils'])if(!Array.isArray(d[k]))d[k]=b[k];return d}}catch(e){}let m=migrateLegacy();if(m.found)localStorage.setItem(KEY,JSON.stringify(m.d));return m.d}let db=load();function save(){localStorage.setItem(KEY,JSON.stringify(db))}function audit(action,module,id){db.journal.push({id:uid('JRN'),date:new Date().toISOString(),action,module,enregistrementId:id});save()}function seq(k){db.sequences[k]=(db.sequences[k]||0)+1;return k+'-'+new Date().getFullYear()+'-'+String(db.sequences[k]).padStart(4,'0')}function money(v){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}).format(num(v))+' '+(db.settings.currency||'CDF')}function article(id){return db.articles.find(x=>x.id===id)}function client(id){return db.clients.find(x=>x.id===id)}function account(id){return db.comptes.find(x=>x.id===id)}
function stock(id){let a=article(id);if(!a)return 0;let q=num(a.initialStock);db.lignesAchat.filter(x=>x.articleId===id).forEach(x=>q+=num(x.quantite));db.lignesVente.filter(x=>x.articleId===id).forEach(x=>q-=num(x.quantite));db.mouvementsStock.filter(x=>x.articleId===id&&x.type==='AJUSTEMENT').forEach(x=>q+=num(x.quantite));return q}function avgCost(id){let a=article(id);if(!a)return 0;let q=num(a.initialStock),v=q*num(a.cost);db.lignesAchat.filter(x=>x.articleId===id).forEach(x=>{q+=num(x.quantite);v+=num(x.quantite)*num(x.coutUnitaireReel)});return q?v/q:num(a.cost)}function balance(id){let c=account(id);if(!c)return 0;let b=num(c.soldeInitial);db.ventes.filter(v=>v.compteId===id).forEach(v=>b+=num(v.montantPaye));db.paiements.filter(p=>p.compteId===id).forEach(p=>b+=num(p.montant));db.depenses.filter(e=>e.compteId===id).forEach(e=>b-=num(e.montant));db.transferts.forEach(t=>{if(t.sourceId===id)b-=num(t.montant);if(t.destinationId===id)b+=num(t.montant)});return b}
const pages=[['dashboard','Tableau de bord'],['sales','Ventes'],['purchases','Achats'],['stock','Articles & Stock'],['finance','Finances'],['clients','Clients'],['reports','Rapports'],['settings','Paramètres']];document.getElementById('nav').innerHTML=pages.map(x=>`<button data-p="${x[0]}">${x[1]}</button>`).join('');document.getElementById('nav').onclick=e=>{let p=e.target.dataset.p;if(p)go(p)};function go(p){location.hash=p;render()}function opts(arr,label='name'){return arr.map(x=>`<option value="${x.id}">${esc(x[label]||x.nom||x.code)}</option>`).join('')}function card(l,v){return`<div class="card"><div class="label">${l}</div><div class="value">${v}</div></div>`}
function dashboard(){let ca=db.ventes.reduce((s,x)=>s+num(x.totalNet),0),rec=db.ventes.reduce((s,x)=>s+num(x.montantPaye),0)+db.paiements.reduce((s,x)=>s+num(x.montant),0),cre=db.ventes.reduce((s,x)=>s+num(x.montantRestant),0),cogs=db.lignesVente.reduce((s,x)=>s+num(x.coutUnitaire)*num(x.quantite),0),dep=db.depenses.reduce((s,x)=>s+num(x.montant),0),sv=db.articles.reduce((s,a)=>s+stock(a.id)*avgCost(a.id),0),low=db.articles.filter(a=>stock(a.id)<=num(a.alertThreshold)).length;return`<div class="grid">${card("Chiffre d'affaires",money(ca))}${card('Encaissements',money(rec))}${card('Créances',money(cre))}${card('Valeur du stock',money(sv))}${card('Coût des ventes',money(cogs))}${card('Marge brute',money(ca-cogs))}${card('Dépenses générales',money(dep))}${card('Résultat estimé',money(ca-cogs-dep))}</div><div class="panel"><h3>Trésorerie</h3>${db.comptes.length?db.comptes.map(c=>`<div>${esc(c.nom)} : <b>${money(balance(c.id))}</b></div>`).join(''):'Aucun compte'}</div><div class="panel"><h3>Alertes</h3><div class="notice ${low?'warning':''}">${low?low+' article(s) en stock faible ou rupture.':'Aucune alerte de stock.'}</div></div>`}
function sales(){let rows=db.ventes.slice().reverse().map(v=>`<tr><td>${v.date}</td><td>${esc(v.numero)}</td><td>${esc(client(v.clientId)?.nom||'Comptant')}</td><td>${money(v.totalNet)}</td><td>${money(v.montantPaye)}</td><td>${money(v.montantRestant)}</td></tr>`).join('');return`<div class="panel"><h3>Nouvelle vente multi-articles</h3><div class="form"><div class="field"><label>Date</label><input id="sDate" type="date" value="${today()}"></div><div class="field"><label>Client</label><select id="sClient"><option value="">Client comptant</option>${opts(db.clients,'nom')}</select></div><div class="field"><label>Compte d'encaissement</label><select id="sAccount"><option value="">Aucun</option>${opts(db.comptes,'nom')}</select></div><div class="field"><label>Mode paiement</label><select id="sMode">${db.modesPaiement.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Montant payé</label><input id="sPaid" type="number" min="0" value="0"></div><div class="field"><label>Observation</label><input id="sObs"></div></div><div class="linebox"><div class="form"><div class="field"><label>Article</label><select id="sArt">${opts(db.articles)}</select></div><div class="field"><label>Quantité</label><input id="sQty" type="number" min="0.01" step="0.01" value="1"></div><div class="field"><label>Prix unitaire</label><input id="sPrice" type="number" min="0" step="0.01"></div></div><div class="actions"><button class="btn" onclick="JA.addSaleLine()">Ajouter la ligne</button></div><div id="saleDraft"></div></div><div class="actions"><button class="btn ok" onclick="JA.saveSale()">Valider la vente</button></div></div><div class="panel"><h3>Historique</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Référence</th><th>Client</th><th>Total</th><th>Payé</th><th>Reste</th></tr></thead><tbody>${rows||'<tr><td colspan=6>Aucune vente</td></tr>'}</tbody></table></div></div>`}
function purchases(){let rows=db.achats.slice().reverse().map(a=>`<tr><td>${a.date}</td><td>${esc(a.numero)}</td><td>${esc(a.fournisseur||'-')}</td><td>${money(a.totalMarchandises)}</td><td>${money(num(a.transport)+num(a.taxes)+num(a.manutention)+num(a.autresFrais))}</td><td>${money(a.coutTotal)}</td></tr>`).join('');return`<div class="panel"><h3>Nouvel achat multi-articles</h3><div class="form"><div class="field"><label>Date</label><input id="pDate" type="date" value="${today()}"></div><div class="field"><label>Fournisseur</label><input id="pSupplier"></div><div class="field"><label>Référence facture</label><input id="pRef"></div><div class="field"><label>Transport</label><input id="pTransport" type="number" value="0"></div><div class="field"><label>Taxes</label><input id="pTaxes" type="number" value="0"></div><div class="field"><label>Manutention</label><input id="pHandling" type="number" value="0"></div><div class="field"><label>Autres frais</label><input id="pOther" type="number" value="0"></div></div><div class="linebox"><div class="form"><div class="field"><label>Article</label><select id="pArt">${opts(db.articles)}</select></div><div class="field"><label>Quantité</label><input id="pQty" type="number" min="0.01" step="0.01" value="1"></div><div class="field"><label>Prix achat unitaire</label><input id="pPrice" type="number" min="0" step="0.01"></div></div><div class="actions"><button class="btn" onclick="JA.addPurchaseLine()">Ajouter la ligne</button></div><div id="purchaseDraft"></div></div><div class="actions"><button class="btn ok" onclick="JA.savePurchase()">Calculer les coûts et valider</button></div></div><div class="panel"><h3>Historique</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Référence</th><th>Fournisseur</th><th>Marchandises</th><th>Frais</th><th>Coût total</th></tr></thead><tbody>${rows||'<tr><td colspan=6>Aucun achat</td></tr>'}</tbody></table></div></div>`}
function nextArticleCode(){
  let max=0;
  db.articles.forEach(a=>{
    let m=String(a.code||'').match(/^ART-(\d+)$/);
    if(m) max=Math.max(max,Number(m[1]));
  });
  return 'ART-'+String(max+1).padStart(4,'0');
}
function stockPage(){let rows=db.articles.map(a=>{let q=stock(a.id),c=avgCost(a.id),p=num(a.sellingPrice),st=q<=0?'Rupture':q<=num(a.alertThreshold)?'Faible':'Normal';return`<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td>${q.toFixed(2)}</td><td>${money(c)}</td><td>${money(p)}</td><td>${money(p-c)}</td><td>${money(q*c)}</td><td><span class="badge ${st==='Normal'?'good':st==='Faible'?'low':'bad'}">${st}</span></td></tr>`}).join('');return`<div class="panel"><h3>Nouvel article</h3><div class="form"><div class="field"><label>Code article</label><input id="aCode" value="${nextArticleCode()}" readonly></div><div class="field"><label>Désignation</label><input id="aName"></div><div class="field"><label>Catégorie</label><select id="aCat">${db.categories.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select></div><div class="field"><label>Unité</label><select id="aUnit">${db.unites.map(x=>`<option value="${esc(x)}" ${x==="Pièce"?"selected":""}>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>Stock initial</label><input id="aStock" type="number" value="0"></div><div class="field"><label>Seuil alerte</label><input id="aAlert" type="number" value="5"></div><div class="field"><label>Coût initial</label><input id="aCost" type="number" value="0" oninput="JA.calcArticlePrice()"></div><div class="field"><label>Marge %</label><input id="aMargin" type="number" value="${num(db.settings.defaultMargin)}" oninput="JA.calcArticlePrice()"></div><div class="field"><label>Prix de vente suggéré</label><input id="aSuggested" type="number" value="0" readonly></div><div class="field"><label>Prix de vente final</label><input id="aSell" type="number" value="0"></div></div><div class="actions"><button class="btn ok" onclick="JA.addArticle()">Enregistrer</button></div></div><div class="panel"><h3>Correction d'inventaire</h3><div class="form"><div class="field"><label>Article</label><select id="iArt">${opts(db.articles)}</select></div><div class="field"><label>Écart (+/-)</label><input id="iQty" type="number" step="0.01"></div><div class="field"><label>Motif obligatoire</label><input id="iReason"></div></div><div class="actions"><button class="btn warn" onclick="JA.adjustStock()">Appliquer la correction</button></div></div><div class="panel"><h3>Stock</h3><div class="tablewrap"><table><thead><tr><th>Code</th><th>Article</th><th>Disponible</th><th>Coût moyen</th><th>Prix vente</th><th>Marge</th><th>Valeur</th><th>État</th></tr></thead><tbody>${rows||'<tr><td colspan=8>Aucun article</td></tr>'}</tbody></table></div></div>`}
function finance(){let ex=db.depenses.slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.categorie)}</td><td>${esc(e.libelle)}</td><td>${money(e.montant)}</td><td>${esc(account(e.compteId)?.nom||'-')}</td></tr>`).join('');let ac=db.comptes.map(c=>`<tr><td>${esc(c.nom)}</td><td>${esc(c.type||'')}</td><td>${money(balance(c.id))}</td></tr>`).join('');let credits=db.ventes.filter(v=>num(v.montantRestant)>0).map(v=>`<option value="${v.id}">${esc(v.numero)} — ${esc(client(v.clientId)?.nom||'Sans client')} — ${money(v.montantRestant)}</option>`).join('');return`<div class="panel"><h3>Dépense générale</h3><div class="form"><div class="field"><label>Date</label><input id="eDate" type="date" value="${today()}"></div><div class="field"><label>Catégorie</label><input id="eCat" value="Autres"></div><div class="field"><label>Libellé</label><input id="eLabel"></div><div class="field"><label>Montant</label><input id="eAmount" type="number"></div><div class="field"><label>Compte</label><select id="eAccount"><option value="">Aucun</option>${opts(db.comptes,'nom')}</select></div></div><div class="actions"><button class="btn ok" onclick="JA.addExpense()">Enregistrer</button></div></div><div class="panel"><h3>Encaissement d'une créance</h3><div class="form"><div class="field"><label>Vente</label><select id="paySale">${credits}</select></div><div class="field"><label>Montant</label><input id="payAmount" type="number"></div><div class="field"><label>Compte</label><select id="payAccount">${opts(db.comptes,'nom')}</select></div></div><div class="actions"><button class="btn" onclick="JA.payCredit()">Encaisser</button></div></div><div class="panel"><h3>Comptes</h3><div class="form"><div class="field"><label>Nom du compte</label><input id="cName"></div><div class="field"><label>Type</label><input id="cType" placeholder="Caisse, Mobile Money, Banque"></div><div class="field"><label>Solde initial</label><input id="cInitial" type="number" value="0"></div></div><div class="actions"><button class="btn" onclick="JA.addAccount()">Ajouter compte</button></div><div class="tablewrap"><table><thead><tr><th>Compte</th><th>Type</th><th>Solde</th></tr></thead><tbody>${ac}</tbody></table></div></div><div class="panel"><h3>Dépenses</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Catégorie</th><th>Libellé</th><th>Montant</th><th>Compte</th></tr></thead><tbody>${ex||'<tr><td colspan=5>Aucune dépense</td></tr>'}</tbody></table></div></div>`}
function clients(){let rows=db.clients.map(c=>{let r=db.ventes.filter(v=>v.clientId===c.id).reduce((s,v)=>s+num(v.montantRestant),0);return`<tr><td>${esc(c.code||'')}</td><td>${esc(c.nom)}</td><td>${esc(c.telephone||'')}</td><td>${money(c.limiteCredit)}</td><td>${money(r)}</td></tr>`}).join('');return`<div class="panel"><h3>Nouveau client</h3><div class="form"><div class="field"><label>Nom</label><input id="clName"></div><div class="field"><label>Téléphone</label><input id="clPhone"></div><div class="field"><label>Limite crédit</label><input id="clLimit" type="number" value="0"></div></div><div class="actions"><button class="btn ok" onclick="JA.addClient()">Ajouter</button></div></div><div class="panel"><h3>Clients et créances</h3><div class="tablewrap"><table><thead><tr><th>Code</th><th>Nom</th><th>Téléphone</th><th>Limite</th><th>Créance</th></tr></thead><tbody>${rows||'<tr><td colspan=5>Aucun client</td></tr>'}</tbody></table></div></div>`}
function reports(){let ca=db.ventes.reduce((s,x)=>s+num(x.totalNet),0),cogs=db.lignesVente.reduce((s,x)=>s+num(x.coutUnitaire)*num(x.quantite),0),dep=db.depenses.reduce((s,x)=>s+num(x.montant),0),ach=db.achats.reduce((s,x)=>s+num(x.coutTotal),0),cre=db.ventes.reduce((s,x)=>s+num(x.montantRestant),0);return`<div class="grid">${card('Ventes',money(ca))}${card('Achats',money(ach))}${card('Coût des ventes',money(cogs))}${card('Marge brute',money(ca-cogs))}${card('Dépenses',money(dep))}${card('Créances',money(cre))}${card('Résultat estimé',money(ca-cogs-dep))}${card('Articles',db.articles.length)}</div><div class="panel"><h3>Principe du résultat</h3><div class="notice">Résultat estimé = chiffre d'affaires − coût des articles vendus − dépenses générales. Les frais d'achat sont déjà intégrés au coût réel des articles.</div></div>`}
function settings(){return`<div class="panel"><h3>Paramètres généraux</h3><div class="form"><div class="field"><label>Entreprise</label><input id="setName" value="${esc(db.settings.businessName)}"></div><div class="field"><label>Devise</label><select id="setCurrency"><option ${db.settings.currency==='CDF'?'selected':''}>CDF</option><option ${db.settings.currency==='USD'?'selected':''}>USD</option><option ${db.settings.currency==='EUR'?'selected':''}>EUR</option></select></div><div class="field"><label>Marge par défaut %</label><input id="setMargin" type="number" value="${num(db.settings.defaultMargin)}"></div></div><div class="actions"><button class="btn ok" onclick="JA.saveSettings()">Enregistrer</button></div></div><div class="panel"><h3>Catégories d’articles</h3><div class="form"><div class="field"><label>Nouvelle catégorie</label><input id="newCategory" placeholder="Ex. Cosmétique"></div></div><div class="actions"><button class="btn ok" onclick="JA.addCategory()">Ajouter la catégorie</button></div><div class="notice">Catégories actuelles : ${db.categories.map(x=>esc(x)).join(", ")}</div></div><div class="panel"><h3>Unités de mesure</h3><div class="form"><div class="field"><label>Nouvelle unité</label><input id="newUnit" placeholder="Ex. Palette"></div></div><div class="actions"><button class="btn ok" onclick="JA.addUnit()">Ajouter l’unité</button></div><div class="notice">Unités actuelles : ${db.unites.map(x=>esc(x)).join(", ")}</div></div><div class="panel"><h3>Sauvegarde et restauration</h3><div class="actions"><button class="btn" onclick="JA.exportData()">Exporter JSON</button><button class="btn danger" onclick="JA.resetData()">Réinitialiser les données</button><label class="btn light">Importer JSON<input id="importer" type="file" accept=".json" hidden onchange="JA.importData(event)"></label></div><div class="notice">L'importation fusionne les enregistrements par identifiant et ne supprime pas automatiquement les anciennes données v2/v3.</div></div><div class="panel"><h3>Synchronisation locale</h3><div class="notice">Structure préparée pour une synchronisation entre appareils : identifiants uniques et journal des opérations. Le transport direct entre appareils n'est pas encore activé dans cette version web.</div></div>`}
function render(){let p=location.hash.slice(1)||'dashboard';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));document.getElementById('title').textContent=pages.find(x=>x[0]===p)?.[1]||'Gestion Jeeb-Ani';let f={dashboard,sales,purchases,stock:stockPage,finance,clients,reports,settings}[p]||dashboard;document.getElementById('content').innerHTML=f();if(p==='sales'){renderSaleDraft();let s=document.getElementById('sArt');if(s)s.onchange=()=>{let a=article(s.value);document.getElementById('sPrice').value=num(a?.sellingPrice)}}if(p==='purchases')renderPurchaseDraft()}
function renderSaleDraft(){let el=document.getElementById('saleDraft');if(!el)return;let t=saleDraft.reduce((s,x)=>s+x.qty*x.price,0);el.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Article</th><th>Qté</th><th>Prix</th><th>Total</th><th></th></tr></thead><tbody>${saleDraft.map((x,i)=>`<tr><td>${esc(article(x.articleId)?.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td><td><button class="btn danger" onclick="JA.rmSale(${i})">Retirer</button></td></tr>`).join('')}</tbody></table></div><div class="summary"><b>Total : ${money(t)}</b></div>`}
function renderPurchaseDraft(){let el=document.getElementById('purchaseDraft');if(!el)return;let t=purchaseDraft.reduce((s,x)=>s+x.qty*x.price,0);el.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Article</th><th>Qté</th><th>Prix achat</th><th>Total</th><th></th></tr></thead><tbody>${purchaseDraft.map((x,i)=>`<tr><td>${esc(article(x.articleId)?.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.qty*x.price)}</td><td><button class="btn danger" onclick="JA.rmPurchase(${i})">Retirer</button></td></tr>`).join('')}</tbody></table></div><div class="summary"><b>Marchandises : ${money(t)}</b></div>`}
window.JA={calcArticlePrice(){let cost=num(aCost.value),margin=num(aMargin.value),suggested=cost*(1+margin/100);aSuggested.value=suggested.toFixed(2);aSell.value=suggested.toFixed(2);},addUnit(){let name=newUnit.value.trim();if(!name)return alert('Nom de l’unité obligatoire.');if(db.unites.some(x=>String(x).toLowerCase()===name.toLowerCase()))return alert('Cette unité existe déjà.');db.unites.push(name);save();render();},addCategory(){let name=newCategory.value.trim();if(!name)return alert('Nom de catégorie obligatoire.');if(db.categories.some(x=>String(x).toLowerCase()===name.toLowerCase()))return alert('Cette catégorie existe déjà.');db.categories.push(name);save();render();},addArticle(){let name=document.getElementById('aName').value.trim(),code=nextArticleCode();if(!code||!name)return alert('Code et désignation obligatoires.');if(db.articles.some(a=>a.code===code))return alert('Ce code article existe déjà.');let cost=num(document.getElementById('aCost').value),margin=num(document.getElementById('aMargin').value),suggested=cost*(1+margin/100),sell=num(document.getElementById('aSell').value)||suggested,a={id:uid('ART'),code,name,category:document.getElementById('aCat').value.trim(),unit:document.getElementById('aUnit').value.trim()||'Pièce',initialStock:num(document.getElementById('aStock').value),alertThreshold:num(document.getElementById('aAlert').value),cost,margin,calculatedSellingPrice:suggested,sellingPrice:sell,createdAt:new Date().toISOString()};db.articles.push(a);audit('CREATE','ARTICLES',a.id);render()},adjustStock(){let id=iArt.value,q=num(iQty.value),r=iReason.value.trim();if(!id||!q||!r)return alert('Article, écart et motif sont obligatoires.');let m={id:uid('MST'),date:today(),articleId:id,type:'AJUSTEMENT',quantite:q,motif:r};db.mouvementsStock.push(m);audit('CREATE','MOUVEMENTS_STOCK',m.id);render()},addSaleLine(){let id=sArt.value,q=num(sQty.value),p=num(sPrice.value),a=article(id);if(!a||q<=0||p<0)return alert('Ligne de vente invalide.');let reserved=saleDraft.filter(x=>x.articleId===id).reduce((s,x)=>s+x.qty,0);if(q+reserved>stock(id))return alert('Stock insuffisant. Disponible : '+stock(id));saleDraft.push({articleId:id,qty:q,price:p});renderSaleDraft()},rmSale(i){saleDraft.splice(i,1);renderSaleDraft()},saveSale(){if(!saleDraft.length)return alert('Ajoutez au moins un article.');let total=saleDraft.reduce((s,x)=>s+x.qty*x.price,0),paid=Math.min(num(sPaid.value),total),cid=sClient.value;if(total-paid>0&&!cid)return alert('Sélectionnez un client pour une vente à crédit ou partiellement payée.');let v={id:uid('VTE'),numero:seq('VTE'),date:sDate.value||today(),clientId:cid,modePaiement:sMode.value,compteId:sAccount.value,totalNet:total,montantPaye:paid,montantRestant:total-paid,observation:sObs.value.trim()};db.ventes.push(v);saleDraft.forEach(x=>{let c=avgCost(x.articleId);db.lignesVente.push({id:uid('LV'),venteId:v.id,articleId:x.articleId,quantite:x.qty,prixUnitaire:x.price,totalLigne:x.qty*x.price,coutUnitaire:c,margeLigne:x.qty*(x.price-c)})});audit('CREATE','VENTES',v.id);saleDraft=[];alert('Vente '+v.numero+' enregistrée.');render()},addPurchaseLine(){let id=pArt.value,q=num(pQty.value),p=num(pPrice.value);if(!id||q<=0||p<0)return alert("Ligne d'achat invalide.");purchaseDraft.push({articleId:id,qty:q,price:p});renderPurchaseDraft()},rmPurchase(i){purchaseDraft.splice(i,1);renderPurchaseDraft()},savePurchase(){if(!purchaseDraft.length)return alert('Ajoutez au moins un article.');let base=purchaseDraft.reduce((s,x)=>s+x.qty*x.price,0),fees=num(pTransport.value)+num(pTaxes.value)+num(pHandling.value)+num(pOther.value),a={id:uid('ACH'),numero:seq('ACH'),date:pDate.value||today(),fournisseur:pSupplier.value.trim(),referenceFacture:pRef.value.trim(),totalMarchandises:base,transport:num(pTransport.value),taxes:num(pTaxes.value),manutention:num(pHandling.value),autresFrais:num(pOther.value),coutTotal:base+fees};db.achats.push(a);purchaseDraft.forEach(x=>{let lineBase=x.qty*x.price,allocated=base?fees*(lineBase/base):0,real=x.qty?(lineBase+allocated)/x.qty:0,art=article(x.articleId),suggested=real*(1+num(art?.margin??db.settings.defaultMargin)/100),finalPrice=num(art?.sellingPrice)||suggested;db.lignesAchat.push({id:uid('LA'),achatId:a.id,articleId:x.articleId,quantite:x.qty,prixAchatUnitaire:x.price,totalArticle:lineBase,fraisAffectes:allocated,coutUnitaireReel:real,prixVenteSuggere:suggested,prixVenteFinal:finalPrice});if(art){art.cost=real;art.calculatedSellingPrice=suggested;if(!num(art.sellingPrice))art.sellingPrice=suggested}});audit('CREATE','ACHATS',a.id);purchaseDraft=[];alert('Achat '+a.numero+' enregistré. Les frais ont été répartis proportionnellement.');render()},addExpense(){if(!eLabel.value.trim()||num(eAmount.value)<=0)return alert('Libellé et montant obligatoires.');let e={id:uid('DEP'),numero:seq('DEP'),date:eDate.value||today(),categorie:eCat.value.trim()||'Autres',libelle:eLabel.value.trim(),montant:num(eAmount.value),compteId:eAccount.value};db.depenses.push(e);audit('CREATE','DEPENSES',e.id);render()},addAccount(){if(!cName.value.trim())return alert('Nom du compte obligatoire.');let c={id:uid('CPT'),nom:cName.value.trim(),type:cType.value.trim(),soldeInitial:num(cInitial.value)};db.comptes.push(c);audit('CREATE','COMPTES',c.id);render()},payCredit(){let v=db.ventes.find(x=>x.id===paySale.value),m=num(payAmount.value);if(!v||m<=0)return alert('Paiement invalide.');m=Math.min(m,num(v.montantRestant));let p={id:uid('PAY'),numero:seq('PAY'),date:today(),venteId:v.id,clientId:v.clientId,montant:m,compteId:payAccount.value};db.paiements.push(p);v.montantRestant-=m;v.montantPaye+=m;audit('CREATE','PAIEMENTS',p.id);render()},addClient(){if(!clName.value.trim())return alert('Nom du client obligatoire.');let c={id:uid('CLI'),code:'CLI-'+String(db.clients.length+1).padStart(4,'0'),nom:clName.value.trim(),telephone:clPhone.value.trim(),limiteCredit:num(clLimit.value)};db.clients.push(c);audit('CREATE','CLIENTS',c.id);render()},saveSettings(){db.settings.businessName=setName.value.trim()||'Gestion Jeeb-Ani';db.settings.currency=setCurrency.value;db.settings.defaultMargin=num(setMargin.value);save();alert('Paramètres enregistrés.');render()},exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Gestion-Jeeb-Ani-sauvegarde-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)},importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);for(let k of ['articles','achats','lignesAchat','ventes','lignesVente','depenses','clients','paiements','comptes','transferts','mouvementsStock','inventaires','journal'])db[k]=mergeUnique(db[k],x[k]);db.settings={...db.settings,...(x.settings||{})};save();alert('Importation fusionnée avec succès.');render()}catch(e){alert('Fichier JSON invalide.')}};r.readAsText(f)},resetData(){if(!confirm('Effacer toutes les données locales de Gestion Jeeb-Ani ?'))return;localStorage.removeItem(KEY);db=blank();save();location.hash='dashboard';render();alert('Données réinitialisées avec succès.')}};window.addEventListener('hashchange',render);render();})();
</script></body></html>
